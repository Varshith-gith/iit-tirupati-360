<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame Multi-Room Tour with Cursor</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@^5.0.0/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Panorama background -->
      <a-sky id="sky" src="GYM.jpg" rotation="0 -90 0"></a-sky>

      <!-- Hotspot to go to Room 2 -->
      <a-box position="2 1 -3"
             depth="0.5" height="0.5" width="0.5"
             color="red"
             event-set__click="_event: click; _target: #sky; src: Coffee.jpg">
      </a-box>
      <a-text value="Go to Room 2"
              position="2 2 -3"
              align="center"
              color="white"
              width="4"></a-text>

      <!-- Hotspot to go back to Room 1 -->
      <a-box position="-2 1 -3"
             depth="0.5" height="0.5" width="0.5"
             color="blue"
             event-set__click="_event: click; _target: #sky; src: GYM.jpg">
      </a-box>
      <a-text value="Back to Room 1"
              position="-2 2 -3"
              align="center"
              color="white"
              width="4"></a-text>

      <!-- Camera with cursor (supports mouse, tap, and gaze click) -->
      <a-entity camera look-controls>
        <a-cursor 
          fuse="true" 
          fuse-timeout="1000" 
          material="color: yellow; shader: flat">
        </a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
